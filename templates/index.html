<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis AI</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); color:#eee; display:flex; flex-direction:column; height:100vh; }
  header { text-align:center; padding:14px; background:rgba(0,0,0,0.35); }
  header h1 { margin:0; font-size:22px; background:linear-gradient(90deg,#00d2ff,#3a7bd5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  header p { margin:4px 0 0; font-size:11px; color:#9aa; }
  header a { color:#00d2ff; }
  .badges { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:6px; font-size:10px; }
  .badge { background:rgba(0,210,255,0.15); color:#00d2ff; padding:2px 8px; border-radius:10px; }
  #chat { flex:1; overflow-y:auto; padding:16px; max-width:800px; margin:0 auto; width:100%; }
  .msg { max-width:85%; margin:10px 0; padding:12px 16px; border-radius:16px; line-height:1.5; white-space:pre-wrap; font-size:15px; }
  .user { background:linear-gradient(135deg,#3a7bd5,#00d2ff); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .bot { background:rgba(255,255,255,0.08); color:#eee; margin-right:auto; border-bottom-left-radius:4px; }
  .thinking span { display:inline-block; width:6px; height:6px; margin:0 2px; background:#00d2ff; border-radius:50%; animation:blink 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay:0.2s; }
  .thinking span:nth-child(3) { animation-delay:0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2;} 40%{opacity:1;} }
  .imgPreview { max-width:200px; border-radius:10px; margin-top:6px; display:block; }
  .confirmBox { margin-top:10px; display:flex; gap:8px; }
  .confirmBox button { padding:8px 14px; border-radius:16px; border:none; cursor:pointer; font-size:13px; }
  .yesBtn { background:#2ecc71; color:#fff; }
  .noBtn { background:#e74c3c; color:#fff; }
  #inputBar { display:flex; flex-wrap:wrap; gap:8px; padding:12px; background:rgba(0,0,0,0.35); max-width:800px; margin:0 auto; width:100%; align-items:center; }
  #inputBox { flex:1; min-width:100px; padding:14px; border-radius:24px; border:none; font-size:16px; background:rgba(255,255,255,0.1); color:#fff; }
  #micBtn, #imgBtn { padding:12px 14px; border-radius:50%; border:2px solid #00d2ff; background:#1c1c3a; color:#fff; font-size:18px; cursor:pointer; min-width:46px; }
  #micBtn.listening { background:#ff3b3b; border-color:#ff3b3b; animation:pulse 1s infinite; }
  @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.4;} 100%{opacity:1;} }
  #sendBtn { padding:14px 20px; border-radius:24px; border:none; background:linear-gradient(135deg,#3a7bd5,#00d2ff); color:#fff; font-size:16px; cursor:pointer; }
  #voiceStatus { text-align:center; padding:4px; font-size:11px; color:#ffcc00; min-height:14px; }
  #voiceToggle { text-align:center; padding:4px; font-size:11px; color:#9aa; }
  #imgInput { display:none; }
</style>
</head>
<body>
<header><h1>🤖 JARVIS</h1><p>Your Personal AI Assistant — <a href="/dashboard">Dashboard</a></p></header>
<div class="badges">
  <span class="badge">CORE ✓</span><span class="badge">MEMORY ✓</span><span class="badge">VOICE ✓</span>
  <span class="badge">VISION ✓</span><span class="badge">WEB ✓</span><span class="badge">KB ✓</span><span class="badge">PROJECTS ✓</span>
</div>
<div id="voiceToggle"><label><input type="checkbox" id="autoSpeak" checked> Jarvis bole jawab zor se</label></div>
<div id="voiceStatus"></div>
<div id="chat"></div>
<div id="inputBar">
  <input id="inputBox" placeholder="Type a message..." autocomplete="off">
  <button id="imgBtn" title="Share image">📷</button>
  <input type="file" id="imgInput" accept="image/*" capture="environment">
  <button id="docBtn" title="Upload document">📄</button>
  <input type="file" id="docInput" accept=".txt,.md">
  <button id="micBtn" title="Speak">🎤</button>
  <button id="sendBtn">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const imgBtn = document.getElementById('imgBtn');
const imgInput = document.getElementById('imgInput');
const docBtn = document.getElementById('docBtn');
const docInput = document.getElementById('docInput');
const autoSpeak = document.getElementById('autoSpeak');
const voiceStatus = document.getElementById('voiceStatus');
const session = 'sess_' + Math.random().toString(36).slice(2);
let pendingImage = null;

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function addThinking() {
  const d = document.createElement('div');
  d.className = 'msg bot thinking';
  d.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function speakText(text) {
  if (!autoSpeak.checked || !('speechSynthesis' in window)) return;
  const clean = text.replace(/[*_`#]/g, '');
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'en-IN'; utter.rate = 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

function startTimer(seconds, label) {
  addMsg('⏱️ Timer started: ' + label + ' (' + seconds + 's)', 'bot');
  setTimeout(() => {
    addMsg('🔔 TIME UP: ' + label, 'bot');
    speakText('Boss, time is up for ' + label);
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = 880;
      osc.connect(ctx.destination); osc.start();
      setTimeout(() => osc.stop(), 600);
    } catch (e) {}
  }, seconds * 1000);
}

function showConfirm(bubble, confirmData) {
  const box = document.createElement('div');
  box.className = 'confirmBox';
  const yes = document.createElement('button');
  yes.className = 'yesBtn'; yes.textContent = '✅ Haan karo';
  const no = document.createElement('button');
  no.className = 'noBtn'; no.textContent = '❌ Nahi';
  box.appendChild(yes); box.appendChild(no);
  bubble.appendChild(box);
  async function respond(approved) {
    box.remove();
    const loading = addThinking();
    const res = await fetch('/confirm', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: confirmData.id, approved: approved})
    });
    const data = await res.json();
    loading.classList.remove('thinking');
    loading.textContent = data.reply;
    speakText(data.reply);
  }
  yes.onclick = () => respond(true);
  no.onclick = () => respond(false);
}

async function send() {
  const text = inputBox.value.trim();
  if (!text && !pendingImage) return;

  if (pendingImage) {
    const userBubble = addMsg(text || '(image sent)', 'user');
    const img = document.createElement('img');
    img.className = 'imgPreview';
    img.src = 'data:image/jpeg;base64,' + pendingImage;
    userBubble.appendChild(img);
    inputBox.value = '';
    const loading = addThinking();
    const imgData = pendingImage;
    pendingImage = null;
    try {
      const res = await fetch('/vision', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text, image: imgData, session: session})
      });
      const data = await res.json();
      loading.classList.remove('thinking');
      loading.textContent = data.reply;
      speakText(data.reply);
    } catch (e) {
      loading.classList.remove('thinking');
      loading.textContent = 'Vision connection error.';
    }
    return;
  }

  addMsg(text, 'user');
  inputBox.value = '';
  const loading = addThinking();
  try {
    const res = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session: session})
    });
    const data = await res.json();
    loading.classList.remove('thinking');
    loading.textContent = data.reply;
    speakText(data.reply);
    if (data.timer) startTimer(data.timer.seconds, data.timer.label);
    if (data.confirm) showConfirm(loading, data.confirm);
    if (data.steps && data.steps.length) {
      const s = document.createElement('div');
      s.style.fontSize = '11px'; s.style.color = '#7fd'; s.style.opacity = '0.8'; s.style.marginTop = '6px';
      s.textContent = '⚙ Steps: ' + data.steps.join(' → ');
      loading.appendChild(s);
    }
  } catch (e) {
    loading.classList.remove('thinking');
    loading.textContent = 'Connection error.';
  }
}

sendBtn.onclick = send;
inputBox.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

imgBtn.onclick = () => imgInput.click();
imgInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 1024;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      pendingImage = dataUrl.split(',')[1];
      inputBox.placeholder = '📷 Image ready - type a question or just Send';
      inputBox.focus();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

docBtn.onclick = () => docInput.click();
docInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const text = ev.target.result;
    addMsg('📄 Uploading document: ' + file.name, 'user');
    const loading = addThinking();
    try {
      const res = await fetch('/upload_doc', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title: file.name, content: text, session: session})
      });
      const data = await res.json();
      loading.classList.remove('thinking');
      loading.textContent = data.reply;
      speakText(data.reply);
    } catch (err) {
      loading.classList.remove('thinking');
      loading.textContent = 'Upload error.';
    }
  };
  reader.readAsText(file);
};

// Restore conversation history on page load
(async function restoreHistory() {
  try {
    const res = await fetch('/history', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session: session})
    });
    const data = await res.json();
    if (data.history && data.history.length > 0) {
      const box = document.getElementById('chatBox') || document.getElementById('chat') || document.getElementById('messages') || document.querySelector('.chat-box') || document.querySelector('.messages');
      if (box) box.innerHTML = '';
      data.history.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'bot'));
    }
  } catch (err) { /* keep default greeting */ }
})();

// Proactive reminder toast
function showToast(text) {
  const toast = document.createElement('div');
  toast.textContent = '⏰ ' + text;
  toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#00d2ff;padding:12px 20px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.5);z-index:9999;font-size:14px;max-width:90%;text-align:center;border:1px solid #00d2ff;';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 8000);
}

setInterval(async () => {
  try {
    const res = await fetch('/check_reminders', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session: session})
    });
    const data = await res.json();
    if (data.due && data.due.length > 0) {
      data.due.forEach(r => {
        showToast(r.text);
        addMsg('⏰ Reminder, Boss: ' + r.text, 'bot');
        if (typeof speakText === 'function') speakText('Boss, reminder: ' + r.text);
      });
    }
  } catch (err) { /* ignore */ }
}, 30000);

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const recog = new SR();
  recog.lang = 'en-IN';
  recog.interimResults = false;
  recog.onstart = () => { micBtn.classList.add('listening'); voiceStatus.textContent = '🎙️ Listening...'; };
  recog.onend = () => { micBtn.classList.remove('listening'); voiceStatus.textContent = ''; };
  recog.onerror = (e) => { micBtn.classList.remove('listening'); voiceStatus.textContent = 'Mic error: ' + e.error; };
  recog.onresult = (e) => { inputBox.value = e.results[0][0].transcript; send(); };
  micBtn.addEventListener('click', () => { try { recog.start(); } catch (err) {} });
} else {
  voiceStatus.textContent = '⚠️ Chrome use karo voice ke liye.';
  micBtn.style.opacity = '0.4';
}

const hour = new Date().getHours();
const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
addMsg(greet + ", Boss! Main Jarvis hoon - ab photo/screenshot bhi dikha sakte ho mujhe.", "bot");
</script>
</body>
</html>
