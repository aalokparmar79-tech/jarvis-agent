<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis AI</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); color:#eee; display:flex; flex-direction:column; height:100vh; }
  header { text-align:center; padding:18px; background:rgba(0,0,0,0.35); }
  header h1 { margin:0; font-size:24px; background:linear-gradient(90deg,#00d2ff,#3a7bd5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  header p { margin:4px 0 0; font-size:12px; color:#9aa; }
  header a { color:#00d2ff; font-size:12px; }
  #chat { flex:1; overflow-y:auto; padding:16px; max-width:800px; margin:0 auto; width:100%; }
  .msg { max-width:85%; margin:10px 0; padding:12px 16px; border-radius:16px; line-height:1.5; white-space:pre-wrap; font-size:15px; }
  .user { background:linear-gradient(135deg,#3a7bd5,#00d2ff); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .bot { background:rgba(255,255,255,0.08); color:#eee; margin-right:auto; border-bottom-left-radius:4px; }
  .confirmBox { margin-top:10px; display:flex; gap:8px; }
  .confirmBox button { padding:8px 14px; border-radius:16px; border:none; cursor:pointer; font-size:13px; }
  .yesBtn { background:#2ecc71; color:#fff; }
  .noBtn { background:#e74c3c; color:#fff; }
  #inputBar { display:flex; flex-wrap:wrap; gap:8px; padding:14px; background:rgba(0,0,0,0.35); max-width:800px; margin:0 auto; width:100%; align-items:center; }
  #inputBox { flex:1; min-width:120px; padding:14px; border-radius:24px; border:none; font-size:16px; background:rgba(255,255,255,0.1); color:#fff; }
  #micBtn { padding:14px 18px; border-radius:50%; border:3px solid #00d2ff; background:#1c1c3a; color:#fff; font-size:20px; cursor:pointer; min-width:54px; }
  #micBtn.listening { background:#ff3b3b; border-color:#ff3b3b; animation:pulse 1s infinite; }
  @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.4;} 100%{opacity:1;} }
  #sendBtn { padding:14px 22px; border-radius:24px; border:none; background:linear-gradient(135deg,#3a7bd5,#00d2ff); color:#fff; font-size:16px; cursor:pointer; }
  #voiceStatus { text-align:center; padding:6px; font-size:12px; color:#ffcc00; min-height:16px; }
  #voiceToggle { text-align:center; padding:6px; font-size:12px; color:#9aa; }
</style>
</head>
<body>
<header><h1>🤖 JARVIS</h1><p>Your Personal AI Assistant — <a href="/dashboard">Dashboard</a></p></header>
<div id="voiceToggle"><label><input type="checkbox" id="autoSpeak" checked> Jarvis bole jawab zor se</label></div>
<div id="voiceStatus"></div>
<div id="chat"></div>
<div id="inputBar">
  <input id="inputBox" placeholder="Type a message..." autocomplete="off">
  <button id="micBtn" title="Tap and speak">🎤</button>
  <button id="sendBtn">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const autoSpeak = document.getElementById('autoSpeak');
const voiceStatus = document.getElementById('voiceStatus');
const session = 'sess_' + Math.random().toString(36).slice(2);

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function speakText(text) {
  if (!autoSpeak.checked) return;
  if (!('speechSynthesis' in window)) return;
  const clean = text.replace(/[*_`#]/g, '');
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'en-IN';
  utter.rate = 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

function startTimer(seconds, label) {
  addMsg('⏱️ Timer started: ' + label + ' (' + seconds + 's)', 'bot');
  setTimeout(() => {
    addMsg('🔔 TIME UP: ' + label, 'bot');
    speakText('Boss, time is up for ' + label);
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = 880;
      osc.connect(ctx.destination); osc.start();
      setTimeout(() => osc.stop(), 600);
    } catch (e) {}
  }, seconds * 1000);
}

function showConfirm(bubble, confirmData) {
  const box = document.createElement('div');
  box.className = 'confirmBox';
  const yes = document.createElement('button');
  yes.className = 'yesBtn'; yes.textContent = '✅ Haan karo';
  const no = document.createElement('button');
  no.className = 'noBtn'; no.textContent = '❌ Nahi';
  box.appendChild(yes); box.appendChild(no);
  bubble.appendChild(box);

  async function respond(approved) {
    box.remove();
    const loading = addMsg('...', 'bot');
    const res = await fetch('/confirm', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: confirmData.id, approved: approved})
    });
    const data = await res.json();
    loading.textContent = data.reply;
    speakText(data.reply);
  }
  yes.onclick = () => respond(true);
  no.onclick = () => respond(false);
}

async function send() {
  const text = inputBox.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  inputBox.value = '';
  const loading = addMsg('...', 'bot');
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session: session})
    });
    const data = await res.json();
    loading.textContent = data.reply;
    speakText(data.reply);
    if (data.timer) startTimer(data.timer.seconds, data.timer.label);
    if (data.confirm) showConfirm(loading, data.confirm);
  } catch (e) {
    loading.textContent = 'Connection error.';
  }
}

sendBtn.onclick = send;
inputBox.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const recog = new SR();
  recog.lang = 'en-IN';
  recog.interimResults = false;
  recog.onstart = () => { micBtn.classList.add('listening'); voiceStatus.textContent = '🎙️ Listening...'; };
  recog.onend = () => { micBtn.classList.remove('listening'); voiceStatus.textContent = ''; };
  recog.onerror = (e) => { micBtn.classList.remove('listening'); voiceStatus.textContent = 'Mic error: ' + e.error; };
  recog.onresult = (e) => { inputBox.value = e.results[0][0].transcript; send(); };
  micBtn.addEventListener('click', () => { try { recog.start(); } catch (err) {} });
} else {
  voiceStatus.textContent = '⚠️ Chrome use karo voice ke liye.';
  micBtn.style.opacity = '0.4';
}

addMsg("Hi Boss! Main Jarvis hoon. Ab web search aur permission-based actions bhi kar sakta hoon.", "bot");
</script>
</body>
</html>
