<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis AI</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); color:#eee; display:flex; flex-direction:column; height:100vh; }
  header { text-align:center; padding:18px; background:rgba(0,0,0,0.35); }
  header h1 { margin:0; font-size:24px; background:linear-gradient(90deg,#00d2ff,#3a7bd5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  header p { margin:4px 0 0; font-size:12px; color:#9aa; }
  #chat { flex:1; overflow-y:auto; padding:16px; max-width:800px; margin:0 auto; width:100%; }
  .msg { max-width:85%; margin:10px 0; padding:12px 16px; border-radius:16px; line-height:1.5; white-space:pre-wrap; font-size:15px; }
  .user { background:linear-gradient(135deg,#3a7bd5,#00d2ff); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .bot { background:rgba(255,255,255,0.08); color:#eee; margin-right:auto; border-bottom-left-radius:4px; }
  #inputBar { display:flex; padding:14px; background:rgba(0,0,0,0.35); max-width:800px; margin:0 auto; width:100%; }
  #inputBox { flex:1; padding:14px; border-radius:24px; border:none; font-size:16px; background:rgba(255,255,255,0.1); color:#fff; }
  #micBtn { margin-left:8px; padding:12px 16px; border-radius:50%; border:none; background:#555; color:#fff; font-size:18px; cursor:pointer; }
  #micBtn.listening { background:#ff3b3b; animation:pulse 1s infinite; }
  @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.5;} 100%{opacity:1;} }
  #sendBtn { margin-left:8px; padding:12px 20px; border-radius:24px; border:none; background:linear-gradient(135deg,#3a7bd5,#00d2ff); color:#fff; font-size:16px; cursor:pointer; }
  #voiceToggle { text-align:center; padding:6px; font-size:12px; color:#9aa; }
  #voiceToggle input { margin-right:6px; }
</style>
</head>
<body>
<header><h1>🤖 JARVIS</h1><p>Your Personal AI Assistant</p></header>
<div id="voiceToggle"><label><input type="checkbox" id="autoSpeak" checked> Jarvis bole jawab zor se (auto-speak)</label></div>
<div id="chat"></div>
<div id="inputBar">
  <input id="inputBox" placeholder="Type or press mic..." autocomplete="off">
  <button id="micBtn">🎤</button>
  <button id="sendBtn">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const autoSpeak = document.getElementById('autoSpeak');
const session = 'sess_' + Math.random().toString(36).slice(2);

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function speakText(text) {
  if (!autoSpeak.checked) return;
  if (!('speechSynthesis' in window)) return;
  const clean = text.replace(/[*_`#]/g, '');
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'en-IN';
  utter.rate = 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

async function send() {
  const text = inputBox.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  inputBox.value = '';
  const loading = addMsg('...', 'bot');
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session: session})
    });
    const data = await res.json();
    loading.textContent = data.reply;
    speakText(data.reply);
  } catch (e) {
    loading.textContent = 'Connection error.';
  }
}

sendBtn.onclick = send;
inputBox.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// Voice input via browser's built-in speech recognition
let recog = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recog = new SR();
  recog.lang = 'en-IN';
  recog.interimResults = false;
  recog.maxAlternatives = 1;

  recog.onstart = () => micBtn.classList.add('listening');
  recog.onend = () => micBtn.classList.remove('listening');
  recog.onerror = () => micBtn.classList.remove('listening');

  recog.onresult = e => {
    const transcript = e.results[0][0].transcript;
    inputBox.value = transcript;
    send();
  };

  micBtn.onclick = () => {
    try { recog.start(); } catch (e) {}
  };
} else {
  micBtn.style.display = 'none';
}

addMsg("Hi Boss! Main Jarvis hoon. Type karo ya mic dabake bolo.", "bot");
</script>
</body>
</html>
