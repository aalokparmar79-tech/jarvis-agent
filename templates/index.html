<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Agent</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); color:#eee; display:flex; flex-direction:column; height:100vh; }
  header { text-align:center; padding:18px; background:rgba(0,0,0,0.35); }
  header h1 { margin:0; font-size:24px; background:linear-gradient(90deg,#00d2ff,#3a7bd5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  header p { margin:4px 0 0; font-size:12px; color:#9aa; }
  #chat { flex:1; overflow-y:auto; padding:16px; max-width:800px; margin:0 auto; width:100%; }
  .msg { max-width:85%; margin:10px 0; padding:12px 16px; border-radius:16px; line-height:1.5; white-space:pre-wrap; font-size:15px; }
  .user { background:linear-gradient(135deg,#3a7bd5,#00d2ff); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .bot { background:rgba(255,255,255,0.08); color:#eee; margin-right:auto; border-bottom-left-radius:4px; }
  .steps { font-size:11px; color:#7fd; opacity:0.8; margin:4px 0 0; white-space:pre-wrap; }
  #inputBar { display:flex; padding:14px; background:rgba(0,0,0,0.35); max-width:800px; margin:0 auto; width:100%; }
  #inputBox { flex:1; padding:14px; border-radius:24px; border:none; font-size:16px; background:rgba(255,255,255,0.1); color:#fff; }
  #sendBtn { margin-left:8px; padding:12px 20px; border-radius:24px; border:none; background:linear-gradient(135deg,#3a7bd5,#00d2ff); color:#fff; font-size:16px; }
</style>
</head>
<body>
<header><h1>🤖 JARVIS AGENT</h1><p>Goal do, main khud steps complete karunga</p></header>
<div id="chat"></div>
<div id="inputBar">
  <input id="inputBox" placeholder="e.g. Ek Telegram weather bot bana do" autocomplete="off">
  <button id="sendBtn">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const session = 'sess_' + Math.random().toString(36).slice(2);

function addMsg(text, cls, steps) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (steps && steps.length) {
    const s = document.createElement('div');
    s.className = 'steps';
    s.textContent = '⚙ ' + steps.join('\\n⚙ ');
    d.appendChild(s);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send() {
  const text = inputBox.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  inputBox.value = '';
  const loading = addMsg('Working on it...', 'bot');
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session: session})
    });
    const data = await res.json();
    loading.textContent = data.reply;
    if (data.steps && data.steps.length) {
      const s = document.createElement('div');
      s.className = 'steps';
      s.textContent = '⚙ ' + data.steps.join('\\n⚙ ');
      loading.appendChild(s);
    }
  } catch (e) {
    loading.textContent = 'Connection error.';
  }
}

sendBtn.onclick = send;
inputBox.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
addMsg("Hi! Main Jarvis Agent hoon. Mujhe ek goal do (jaise 'ek bot bana do jo X kare') aur main khud steps follow karke poora karunga.", "bot");
</script>
</body>
</html>
